training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  primary_metric: "f1_weighted"
  stratify: true

evaluation:
  metrics:
    - accuracy
    - f1_weighted
    - precision_weighted
    - recall_weighted
    - roc_auc

artifacts:
  artifacts_dir: "artifacts"
  models_dir: "artifacts/models"
  plots_dir: "artifacts/plots"
  metrics_path: "artifacts/metrics.json"
  training_results_path: "artifacts/training_results.json"
  shap_explainer_path: "artifacts/shap_explainer.pkl"
