training:
    test_size: 0.2
    random_state: 42
    cv_folds: 5
    primary_metric: "f1_weighted"
    risk_thresholds:
      low: 0.0
      medium: 0.4
      high: 0.7

mlflow:
  experiment_name: "credit-risk-analysis"
  run_tags:
    project: "credit-risk-MLOps"
    author: "Mohit Raj Rathor"

artifacts:
  models_dir: "artifacts/models/"
  plots_dir: "artifacts/plots/"
  metrics_path: "metrics.json"